<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Çınarköy Nöbet — OCR.space Plaka Tanıma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121417; --surface:#1b1e23; --surface-2:#22262c; --surface-3:#2a2f36;
  --border:#333941; --text:#eef0f2; --text-dim:#98a1ab; --text-faint:#5d646d;
  --amber:#f2a93b; --amber-dim:#7a5a1e; --amber-glow:rgba(242,169,59,.18);
  --green:#4fae7d; --green-dim:#1f4b36;
  --red:#e2574c; --red-dim:#4a231f;
  --mono:'JetBrains Mono','Courier New',monospace;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;overflow:hidden;}
body{
  background:var(--bg); color:var(--text); font-family:var(--sans);
  -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

/* Header */
header.topbar{
  padding:16px 18px 12px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);background:var(--bg);z-index:10;
}
header.topbar h1{font-size:15px;font-weight:700;margin:0;letter-spacing:.2px;}
header.topbar h1 span{color:var(--amber);}
header.topbar .clock{font-family:var(--mono);font-size:13px;color:var(--text-dim);}

/* Main */
main{flex:1;overflow-y:auto;padding:16px 16px 90px;}
.panel{display:none;}
.panel.active{display:block;}

/* Status badge */
.status-badge{
  display:inline-flex;align-items:center;gap:8px;padding:8px 12px;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  font-size:12px;margin-bottom:14px;
}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--text-faint);}
.status-dot.ready{background:var(--green);animation:pulse 2s infinite;}
.status-dot.busy{background:var(--amber);animation:pulse .8s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

/* Camera */
.viewfinder-wrap{
  position:relative;width:100%;aspect-ratio:4/5;background:#000;border-radius:12px;
  overflow:hidden;border:1px solid var(--border);margin-bottom:14px;
}
.viewfinder-wrap video{width:100%;height:100%;object-fit:cover;display:block;}
.guide{
  position:absolute;left:8%;top:40%;width:84%;height:20%;
  border:2px solid var(--amber);border-radius:8px;pointer-events:none;
  box-shadow:0 0 0 2000px rgba(0,0,0,.4);
}
.guide::after{
  content:'PLAKA BURAYA';position:absolute;bottom:-28px;left:50%;
  transform:translateX(-50%);font-size:11px;font-weight:700;
  color:var(--amber);letter-spacing:1px;
}

/* Capture button */
.capture-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px;}
.capture-btn{
  width:72px;height:72px;border-radius:50%;background:var(--amber);border:none;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:transform .15s;box-shadow:0 4px 16px rgba(242,169,59,.3);
}
.capture-btn:active{transform:scale(.9);}
.capture-btn:disabled{opacity:.3;pointer-events:none;}
.capture-btn svg{width:32px;height:32px;stroke:#241c0a;fill:none;}

/* Manual button */
.manual-btn{
  background:none;border:1px solid var(--border);color:var(--text-dim);
  font-family:var(--sans);font-size:13px;cursor:pointer;padding:10px 16px;
  border-radius:8px;transition:all .15s;
}
.manual-btn:hover{background:var(--surface-2);color:var(--text);}

/* Result card */
.result-card{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:16px;display:none;margin-bottom:14px;
}
.result-card.show{display:block;animation:slideUp .3s ease;}
@keyframes slideUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

.confidence-badge{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
  padding:4px 10px;border-radius:20px;margin-bottom:12px;
}
.confidence-badge.high{background:var(--green-dim);color:#a8e6c6;}
.confidence-badge.medium{background:var(--amber-dim);color:#ffdca6;}
.confidence-badge.low{background:var(--red-dim);color:#ffc9c3;}

.field{margin-bottom:12px;}
.field label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:5px;}
.field input{
  width:100%;padding:12px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-family:var(--mono);font-size:18px;
  font-weight:700;letter-spacing:1px;text-transform:uppercase;
}
.field input:focus{outline:none;border-color:var(--amber);}
.field .hint{font-size:11px;color:var(--text-faint);margin-top:5px;}

.btn-row{display:flex;gap:10px;margin-top:14px;}
.btn{
  flex:1;padding:12px;border-radius:8px;border:1px solid var(--border);
  font-weight:700;font-size:14px;cursor:pointer;font-family:var(--sans);
  transition:all .15s;
}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#241c0a;}
.btn.primary:hover{background:#e09a37;}
.btn.ghost{background:transparent;color:var(--text-dim);}
.btn.ghost:hover{background:var(--surface-2);}

/* Stats */
.stats-row{display:flex;gap:10px;margin-bottom:14px;}
.stat{
  flex:1;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px;text-align:center;
}
.stat b{display:block;font-size:20px;font-family:var(--mono);color:var(--amber);}
.stat span{font-size:11px;color:var(--text-dim);}

/* Log */
.log-item{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:10px;
}
.log-item .row1{display:flex;justify-content:space-between;align-items:center;}
.log-item .plate{font-family:var(--mono);font-weight:700;font-size:16px;letter-spacing:1px;}
.log-item .courier{font-size:13px;color:var(--text-dim);margin-top:2px;}
.log-item .meta{font-size:11px;color:var(--text-faint);margin-top:6px;display:flex;justify-content:space-between;}
.tag{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700;}
.tag.high{background:var(--green-dim);color:#a8e6c6;}
.tag.medium{background:var(--amber-dim);color:#ffdca6;}
.tag.low{background:var(--red-dim);color:#ffc9c3;}
.del-btn{background:none;border:none;color:var(--red);font-size:12px;cursor:pointer;}

/* Couriers */
.courier-row{
  display:flex;gap:8px;align-items:center;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;
}
.courier-row .plate{font-family:var(--mono);font-weight:700;width:96px;flex:none;font-size:13px;}
.courier-row .name{flex:1;font-size:13px;}
.add-courier{display:flex;gap:8px;margin-bottom:16px;}
.add-courier input{
  flex:1;padding:10px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:13px;
}
.add-courier input.plate-in{font-family:var(--mono);flex:0 0 110px;text-transform:uppercase;}

/* Tab bar */
nav.tabbar{
  position:fixed;bottom:0;left:0;right:0;padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--surface);border-top:1px solid var(--border);z-index:10;
}
.tabbar-inner{max-width:520px;margin:0 auto;display:flex;}
.tabbar-inner button{
  flex:1;background:none;border:none;color:var(--text-faint);padding:10px 4px 8px;
  font-family:var(--sans);font-size:11px;font-weight:600;display:flex;
  flex-direction:column;align-items:center;gap:4px;cursor:pointer;
}
.tabbar-inner button.active{color:var(--amber);}
.tabbar-inner svg{width:20px;height:20px;stroke:currentColor;fill:none;}

/* Messages */
.msg{padding:12px 14px;border-radius:8px;font-size:13px;line-height:1.5;margin-bottom:14px;}
.msg.info{background:rgba(79,216,201,.1);color:#4FD8C9;border:1px solid rgba(79,216,201,.2);}
.msg.warn{background:var(--amber-dim);color:#ffdca6;border:1px solid var(--amber);}
.msg.error{background:var(--red-dim);color:#ffc9c3;border:1px solid var(--red);}
.msg.hide{display:none;}

::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1>Çınarköy <span>Nöbet</span></h1>
    <div class="clock" id="clockEl">--:--</div>
  </header>

  <main>
    <!-- TARAMA -->
    <section class="panel active" id="panel-tarama">
      <div class="status-badge">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">OCR motoru hazırlanıyor...</span>
      </div>

      <div class="viewfinder-wrap">
        <video id="video" autoplay playsinline muted></video>
        <div class="guide"></div>
      </div>

      <div class="capture-row">
        <button class="capture-btn" id="captureBtn" disabled>
          <svg viewBox="0 0 24 24" stroke-width="2">
            <path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 011 1v9a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1z"/>
            <circle cx="12" cy="13.5" r="3.2"/>
          </svg>

        </div>

    <!-- KAYITLAR -->
    <section class="panel" id="panel-kayitlar">

        <div class="stat"><b id="statTotal">0</b><span>Toplam</span></div>
        <div class="stat"><b id="statSuccess">0</b><span>Başarılı</span></div>
        <div class="stat"><b id="statManual">0</b><span>Elle</span></div>
      </div>
      <div class="btn-row" style="margin-bottom:14px;">
        <button class="btn ghost" id="exportBtn">CSV İndir</button>
        <button class="btn ghost" id="clearLogBtn">Temizle</button>
      </div>
      <div id="logList"></div>
    </section>

    <!-- KURYELER -->
    <section class="panel" id="panel-kuryeler">
      <div class="add-courier">
        <input class="plate-in" id="newCourierPlate" placeholder="34ABC123">
        <input id="newCourierName" placeholder="Kurye adı">
        <button class="btn primary" style="padding:10px 14px;" id="addCourierBtn">Ekle</button>
      </div>

  </main>

  <nav class="tabbar">
    <div class="tabbar-inner">
      <button class="tab-btn active" data-panel="tarama">

          <path d="M3 8l1.5-3h15L21 8v11a1 1 0 01-1 1H4a1 1 0 01-1-1V8z"/>
          <circle cx="12" cy="13" r="3.2"/>
        </svg>
        Tarama
      </button>
      <button class="tab-btn" data-panel="kayitlar">
        <svg viewBox="0 0 24 24" stroke-width="2">
          <path d="M4 4h16v16H4z"/>
          <path d="M8 9h8M8 13h8M8 17h5"/>
        </svg>
        Kayıtlar
      </button>
      <button class="tab-btn" data-panel="kuryeler">
        <svg viewBox="0 0 24 24" stroke-width="2">
          <circle cx="9" cy="8" r="3"/>
          <path d="M2 20c0-3.3 3-6 7-6s7 2.7 7 6"/>
          <circle cx="18" cy="8" r="2.4"/>
          <path d="M15.5 14.2c2.6.4 4.5 2.6 4.5 5.8"/>
        </svg>
        Kuryeler
      </button>
    </div>
  </nav>
</div>

<canvas id="workCanvas" style="display:none;"></canvas>

<script>
(function(){
'use strict';

// OCR.space API Configuration - Dual Key System (50,000 requests/month)
const OCR_API_KEYS = [
  'K81442206688957',  // Key 1: 25,000/month
  'K83546183188957'   // Key 2: 25,000/month
];
const OCR_API_URL = 'https://api.ocr.space/parse/image';
let currentKeyIndex = 0;

// Storage keys
const LS_COURIERS = 'cinarkoy_kuryeler_v2';
const LS_LOG = 'cinarkoy_kayitlar_v2';
const LS_STATS = 'cinarkoy_stats_v2';

// Turkish license plate provinces
const IL_KODLARI = {"01":"Adana","02":"Adıyaman","03":"Afyonkarahisar","04":"Ağrı","05":"Amasya","06":"Ankara","07":"Antalya","08":"Artvin","09":"Aydın","10":"Balıkesir","11":"Bilecik","12":"Bingöl","13":"Bitlis","14":"Bolu","15":"Burdur","16":"Bursa","17":"Çanakkale","18":"Çankırı","19":"Çorum","20":"Denizli","21":"Diyarbakır","22":"Edirne","23":"Elazığ","24":"Erzincan","25":"Erzurum","26":"Eskişehir","27":"Gaziantep","28":"Giresun","29":"Gümüşhane","30":"Hakkari","31":"Hatay","32":"Isparta","33":"Mersin","34":"İstanbul","35":"İzmir","36":"Kars","37":"Kastamonu","38":"Kayseri","39":"Kırklareli","40":"Kırşehir","41":"Kocaeli","42":"Konya","43":"Kütahya","44":"Malatya","45":"Manisa","46":"Kahramanmaraş","47":"Mardin","48":"Muğla","49":"Muş","50":"Nevşehir","51":"Niğde","52":"Ordu","53":"Rize","54":"Sakarya","55":"Samsun","56":"Siirt","57":"Sinop","58":"Sivas","59":"Tekirdağ","60":"Tokat","61":"Trabzon","62":"Tunceli","63":"Şanlıurfa","64":"Uşak","65":"Van","66":"Yozgat","67":"Zonguldak","68":"Aksaray","69":"Bayburt","70":"Karaman","71":"Kırıkkale","72":"Batman","73":"Şırnak","74":"Bartın","75":"Ardahan","76":"Iğdır","77":"Yalova","78":"Karabük","79":"Kilis","80":"Osmaniye","81":"Düzce"};

// State
let couriers = loadJSON(LS_COURIERS, []);
let log = loadJSON(LS_LOG, []);
let stats = loadJSON(LS_STATS, {total:0, success:0, manual:0});
let video, canvas, ctx;
let cameraReady = false;
let ocrReady = false;
let processing = false;

// DOM elements
const $ = id => document.getElementById(id);
const statusDot = $('statusDot');
const statusText = $('statusText');
const captureBtn = $('captureBtn');
const manualBtn = $('manualBtn');
const resultCard = $('resultCard');
const plateInput = $('plateInput');
const courierInput = $('courierInput');
const confidenceBadge = $('confidenceBadge');
const plateHint = $('plateHint');
const msgBox = $('msgBox');
const saveBtn = $('saveBtn');
const discardBtn = $('discardBtn');

// Utility functions
function loadJSON(key, fallback){
  try{
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  }catch(e){return fallback;}
}

function saveJSON(key, val){
  try{
    localStorage.setItem(key, JSON.stringify(val));
  }catch(e){console.error('Storage error:',e);}
}

function normalizePlate(raw){
  return (raw||'').toUpperCase()
    .replace(/[İIı]/g,'I')
    .replace(/O/g,'0')
    .replace(/[^A-Z0-9]/g,'')
    .replace(/^([0-9]{2})([A-Z]+)([0-9]+)$/, '$1 $2 $3');
}

function validatePlate(norm){
  const compact = norm.replace(/\s+/g,'');
  const m = compact.match(/^([0-8][0-9])([A-Z]{1,3})([0-9]{2,4})$/);
  if(!m) return {valid:false};
  const il = m[1];
  if(il==='00') return {valid:false};
  return {valid:true, il, harf:m[2], rakam:m[3], display: il+' '+m[2]+' '+m[3]};
}

function findCourier(plate){
  const compact = plate.replace(/\s+/g,'');
  return couriers.find(c => c.plate.replace(/\s+/g,'') === compact);
}

function showMsg(text, type='info'){
  msgBox.textContent = text;
  msgBox.className = 'msg ' + type;
}

function hideMsg(){
  msgBox.className = 'msg hide';
}

function setStatus(state, text){
  statusDot.className = 'status-dot ' + state;
  statusText.textContent = text;
}

// Initialize
function init(){
  video = $('video');
  canvas = $('workCanvas');
  ctx = canvas.getContext('2d');
  
  // Clock
  function tickClock(){
    const d = new Date();
    $('clockEl').textContent = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }
  tickClock();
  setInterval(tickClock, 15000);
  
  // Camera
  startCamera();
  
  // OCR ready immediately (API-based)
  ocrReady = true;
  updateStatus();
  
  // Events
  captureBtn.addEventListener('click', capture);
  manualBtn.addEventListener('click', showManualEntry);
  saveBtn.addEventListener('click', saveEntry);
  discardBtn.addEventListener('click', hideResult);
  
  plateInput.addEventListener('input', e => {
    const norm = normalizePlate(e.target.value);
    const valid = validatePlate(norm);
    if(valid.valid){
      plateHint.textContent = IL_KODLARI[valid.il] || '';
      plateHint.style.color = 'var(--green)';
    }else{
      plateHint.textContent = norm ? 'Geçersiz format' : '';
      plateHint.style.color = 'var(--red)';
    }
  });
  
  // Tabs
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      $('panel-' + btn.dataset.panel).classList.add('active');
      if(btn.dataset.panel === 'kayitlar') renderLog();
      if(btn.dataset.panel === 'kuryeler') renderCouriers();
    });
  });
  
  // Couriers
  $('addCourierBtn').addEventListener('click', addCourier);
  $('exportBtn').addEventListener('click', exportCSV);
  $('clearLogBtn').addEventListener('click', clearLog);
}

function updateStatus(){
  if(!cameraReady){
    setStatus('busy', 'Kamera başlatılıyor...');
    captureBtn.disabled = true;
  }else if(!ocrReady){
    setStatus('busy', 'OCR motoru hazırlanıyor...');
    captureBtn.disabled = true;
  }else if(processing){
    setStatus('busy', 'Plaka okunuyor...');
    captureBtn.disabled = true;
  }else{
    setStatus('ready', 'Hazır — Fotoğraf çekebilirsiniz');
    captureBtn.disabled = false;
  }
}

// OCR API with automatic key rotation and retry logic
async function callOCRAPI(blob, retryCount = 0){
  const formData = new FormData();
  formData.append('file', blob, 'plate.jpg');
  formData.append('language', 'eng');
  formData.append('isOverlayRequired', 'false');
  formData.append('detectOrientation', 'true');
  formData.append('scale', 'true');
  formData.append('OCREngine', '2');
  
  try{
    const response = await fetch(OCR_API_URL, {
      method: 'POST',
      headers: {'apikey': OCR_API_KEYS[currentKeyIndex]},
      body: formData
    });
    
    if(!response.ok){
      // If 429 (rate limit), try next key
      if(response.status === 429 && retryCount < OCR_API_KEYS.length){
        console.warn(`Key ${currentKeyIndex} rate limited, switching to next key`);
        currentKeyIndex = (currentKeyIndex + 1) % OCR_API_KEYS.length;
        return await callOCRAPI(blob, retryCount + 1);
      }
      throw new Error('OCR API hata: ' + response.status);
    }
    
    return await response.json();
  }catch(err){
    // Network error - try next key once
    if(retryCount === 0 && OCR_API_KEYS.length > 1){
      console.warn('Network error, trying backup key');
      currentKeyIndex = (currentKeyIndex + 1) % OCR_API_KEYS.length;
      return await callOCRAPI(blob, retryCount + 1);
    }
    throw err;
  }
}

function startCamera(){
  if(!navigator.mediaDevices){
    showMsg('Kamera desteklenmiyor. "Elle Gir" kullanın.', 'warn');
    return;
  }
  
  navigator.mediaDevices.getUserMedia({
    video: {facingMode:'environment', width:{ideal:1920}, height:{ideal:1080}},
    audio: false
  })
  .then(stream => {
    video.srcObject = stream;
    cameraReady = true;
    updateStatus();
    hideMsg();
  })
  .catch(err => {
    showMsg('Kamera izni verilmedi. "Elle Gir" kullanın.', 'error');
    console.error('Camera error:', err);
  });
}

async function capture(){
  if(!cameraReady || processing) return;
  
  processing = true;
  updateStatus();
  hideMsg();
  
  try{
    // Capture frame
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);
    
    // Compress to <1MB
    let quality = 0.7;
    let blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
    
    while(blob.size > 900000 && quality > 0.2){
      quality -= 0.1;
      blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
    }
    
    showMsg('Plaka okunuyor...', 'info');
    
    // Call OCR.space API with automatic key rotation
    const result = await callOCRAPI(blob);
    
    if(result.IsErroredOnProcessing){
      throw new Error(result.ErrorMessage || 'OCR işleme hatası');
    }
    
    if(!result.ParsedResults || result.ParsedResults.length === 0){
      throw new Error('Sonuç bulunamadı');
    }
    
    const parsed = result.ParsedResults[0];
    const text = parsed.ParsedText || '';
    const confidence = parsed.Confidence || 0;
    
    if(!text.trim()){
      throw new Error('Plaka okunamadı');
    }
    
    // Normalize and validate
    const normalized = normalizePlate(text);
    const validation = validatePlate(normalized);
    
    hideMsg();
    
    if(validation.valid){
      showResult(validation.display, confidence, false);
    }else{
      showMsg('Plaka tanınamadı. Elle düzeltin.', 'warn');
      showResult(normalized || '', Math.max(0, confidence-30), false);
    }
    
  }catch(err){
    console.error('OCR error:', err);
    showMsg('Okuma başarısız: ' + err.message, 'error');
  }finally{
    processing = false;
    updateStatus();
  }
}

function showManualEntry(){
  hideMsg();
  showResult('', 0, true);
}

function showResult(plate, confidence, isManual){
  plateInput.value = plate;
  courierInput.value = '';
  
  // Set confidence badge
  if(isManual){
    confidenceBadge.className = 'confidence-badge low';
    confidenceBadge.textContent = '✎ Elle girildi';
  }else if(confidence >= 70){
    confidenceBadge.className = 'confidence-badge high';
    confidenceBadge.textContent = '✓ Yüksek güven';
  }else if(confidence >= 40){
    confidenceBadge.className = 'confidence-badge medium';
    confidenceBadge.textContent = '~ Orta güven';
  }else{
    confidenceBadge.className = 'confidence-badge low';
    confidenceBadge.textContent = '⚠ Düşük güven';
  }
  
  // Auto-fill courier if found
  const courier = findCourier(plate);
  if(courier){
    courierInput.value = courier.name;
    plateHint.textContent = 'Kurye otomatik eşleşti';
    plateHint.style.color = 'var(--green)';
  }
  
  resultCard.classList.add('show');
  plateInput.focus();
}

function hideResult(){
  resultCard.classList.remove('show');
  plateInput.value = '';
  courierInput.value = '';
  hideMsg();
}

function saveEntry(){
  const plate = plateInput.value.trim();
  const courier = courierInput.value.trim();
  
  if(!plate){
    showMsg('Plaka boş olamaz!', 'error');
    return;
  }
  
  const normalized = normalizePlate(plate);
  const validation = validatePlate(normalized);
  
  if(!validation.valid){
    showMsg('Geçersiz plaka formatı!', 'error');
    return;
  }
  
  // Determine if manual or OCR
  const isManual = confidenceBadge.textContent.includes('Elle');
  const confidence = confidenceBadge.className.includes('high') ? 'high' :
                     confidenceBadge.className.includes('medium') ? 'medium' : 'low';
  
  // Save to log
  const entry = {
    plate: validation.display,
    courier: courier || 'Bilinmiyor',
    timestamp: Date.now(),
    confidence,
    manual: isManual
  };
  
  log.unshift(entry);
  saveJSON(LS_LOG, log);
  
  // Update stats
  stats.total++;
  if(isManual) stats.manual++;
  else if(confidence === 'high') stats.success++;
  saveJSON(LS_STATS, stats);
  
  // Auto-add courier if not exists
  if(courier && !findCourier(validation.display)){
    couriers.push({plate: validation.display, name: courier});
    saveJSON(LS_COURIERS, couriers);
  }
  
  showMsg('✓ Kayıt başarılı!', 'info');
  setTimeout(() => {
    hideResult();
    hideMsg();
  }, 1500);
}

function renderLog(){
  const list = $('logList');
  
  $('statTotal').textContent = stats.total;
  $('statSuccess').textContent = stats.success;
  $('statManual').textContent = stats.manual;
  
  if(log.length === 0){
    list.innerHTML = '<div class="msg info">Henüz kayıt yok</div>';
    return;
  }
  
  list.innerHTML = log.map((entry, idx) => {
    const date = new Date(entry.timestamp);
    const timeStr = date.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'});
    const dateStr = date.toLocaleDateString('tr-TR', {day:'numeric', month:'short'});
    
    return `<div class="log-item">
      <div class="row1">
        <div>
          <div class="plate">${entry.plate}</div>
          <div class="courier">${entry.courier}</div>
        </div>
        <button class="del-btn" onclick="deleteLog(${idx})">Sil</button>
      </div>
      <div class="meta">
        <span class="tag ${entry.confidence}">${entry.manual ? 'Elle' : entry.confidence}</span>
        <span>${timeStr} · ${dateStr}</span>
      </div>
    </div>`;
  }).join('');
}

window.deleteLog = function(idx){
  if(!confirm('Bu kaydı silmek istediğinize emin misiniz?')) return;
  log.splice(idx, 1);
  saveJSON(LS_LOG, log);
  stats.total = Math.max(0, stats.total - 1);
  saveJSON(LS_STATS, stats);
  renderLog();
};

function clearLog(){
  if(!confirm('Tüm kayıtları silmek istediğinize emin misiniz?')) return;
  log = [];
  stats = {total:0, success:0, manual:0};
  saveJSON(LS_LOG, log);
  saveJSON(LS_STATS, stats);
  renderLog();
}

function exportCSV(){
  if(log.length === 0){
    alert('Kayıt yok!');
    return;
  }
  
  const csv = 'Plaka,Kurye,Tarih,Saat,Güven,Elle\n' + 
    log.map(e => {
      const d = new Date(e.timestamp);
      return `${e.plate},${e.courier},${d.toLocaleDateString('tr-TR')},${d.toLocaleTimeString('tr-TR')},${e.confidence},${e.manual?'Evet':'Hayır'}`;
    }).join('\n');
  
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'cinarkoy-kayitlar-' + Date.now() + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function renderCouriers(){
  const list = $('courierList');
  if(couriers.length === 0){
    list.innerHTML = '<div class="msg info">Henüz kurye yok</div>';
    return;
  }
  list.innerHTML = couriers.map((c, idx) => 
    `<div class="courier-row">
      <div class="plate">${c.plate}</div>
      <div class="name">${c.name}</div>
      <button class="del-btn" onclick="deleteCourier(${idx})">Sil</button>
    </div>`
  ).join('');
}

function addCourier(){
  const plate = $('newCourierPlate').value.trim();
  const name = $('newCourierName').value.trim();
  
  if(!plate || !name){
    alert('Plaka ve isim boş olamaz!');
    return;
  }
  
  const normalized = normalizePlate(plate);
  const validation = validatePlate(normalized);
  
  if(!validation.valid){
    alert('Geçersiz plaka formatı!');
    return;
  }
  
  if(findCourier(validation.display)){
    alert('Bu plaka zaten kayıtlı!');
    return;
  }
  
  couriers.push({plate: validation.display, name});
  saveJSON(LS_COURIERS, couriers);
  
  $('newCourierPlate').value = '';
  $('newCourierName').value = '';
  renderCouriers();
}

window.deleteCourier = function(idx){
  if(!confirm('Bu kuryeyi silmek istediğinize emin misiniz?')) return;
  couriers.splice(idx, 1);
  saveJSON(LS_COURIERS, couriers);
  renderCouriers();
};

// Start
init();

})();
</script>
</body>
</html>
